name: Group Release Notes

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v6.24.0"
        required: true
        type: string

jobs:
  organize-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve release info
        id: release-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.version }}"

            echo "Manual run requested for release tag: ${RELEASE_TAG}"

            if ! gh release view "${RELEASE_TAG}" --json tagName,publishedAt >/tmp/release.json; then
              echo "Release ${RELEASE_TAG} does not exist."
              exit 1
            fi

            RELEASE_TAG="$(jq -r '.tagName' /tmp/release.json)"
            PUBLISHED_AT="$(jq -r '.publishedAt' /tmp/release.json)"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            PUBLISHED_AT="${{ github.event.release.published_at }}"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "published_at=${PUBLISHED_AT}" >> "${GITHUB_OUTPUT}"

          echo "Resolved release tag: ${RELEASE_TAG}"
          echo "Resolved published_at: ${PUBLISHED_AT}"

      - name: Move pr- files to release folder
        run: |
          RELEASE_TAG="${{ steps.release-info.outputs.release_tag }}"
          PUBLISHED_AT="${{ steps.release-info.outputs.published_at }}"

          SOURCE_DIR="release-notes"
          TARGET_DIR="release-notes/${RELEASE_TAG}"

          echo "Release tag: ${RELEASE_TAG}"
          echo "Published at: ${PUBLISHED_AT}"
          echo "Moving files from ${SOURCE_DIR} to ${TARGET_DIR}"

          # If the folder already exists, do nothing.
          if [ -d "${TARGET_DIR}" ]; then
            echo "${TARGET_DIR} already exists. Nothing to do."
            exit 0
          fi

          # Check if any pr- files exist
          shopt -s nullglob
          PR_FILES=("${SOURCE_DIR}"/pr-*)

          if [ ${#PR_FILES[@]} -eq 0 ]; then
            echo "No pr- files found in ${SOURCE_DIR}. Nothing to do."
            exit 0
          fi

          # Create the target directory
          mkdir -p "${TARGET_DIR}"

          # Move all files starting with pr-
          for FILE in "${PR_FILES[@]}"; do
            FILENAME=$(basename "${FILE}")
            echo "Moving ${FILENAME} → ${TARGET_DIR}/${FILENAME}"
            mv "${FILE}" "${TARGET_DIR}/${FILENAME}"
          done

          echo "Done. Moved ${#PR_FILES[@]} file(s) to ${TARGET_DIR}."

          # Build filename → title map
          FILES_JSON="{"
          FIRST=true
          for FILE in "${TARGET_DIR}"/pr-*; do
            FILENAME=$(basename "${FILE}")
            TITLE=$(head -n 1 "${FILE}" | sed 's/^#\+[[:space:]]*//')

            FILENAME_ESCAPED=$(jq -Rr @json <<< "${FILENAME}")
            TITLE_ESCAPED=$(jq -Rr @json <<< "${TITLE}")

            if [ "${FIRST}" = true ]; then
              FILES_JSON+="${FILENAME_ESCAPED}: ${TITLE_ESCAPED}"
              FIRST=false
            else
              FILES_JSON+=", ${FILENAME_ESCAPED}: ${TITLE_ESCAPED}"
            fi
          done
          FILES_JSON+="}"

          cat > "${TARGET_DIR}/metadata.json" <<EOF
          {
            "published_at": "${PUBLISHED_AT}",
            "files": ${FILES_JSON}
          }
          EOF

          echo "Created ${TARGET_DIR}/metadata.json"

      - name: Commit and push changes
        run: |
          RELEASE_TAG="${{ steps.release-info.outputs.release_tag }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release-notes/

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: archive release notes for ${RELEASE_TAG}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
